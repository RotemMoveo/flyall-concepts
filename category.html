<style>
@font-face{font-family:'Almoni';src:url('assets/fonts/almoni-dl-aaa-300.ttf') format('truetype');font-weight:300;font-display:swap}
@font-face{font-family:'Almoni';src:url('assets/fonts/almoni-dl-aaa-400.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Almoni';src:url('assets/fonts/almoni-dl-aaa-700.ttf') format('truetype');font-weight:700;font-display:swap}

/* ============================================================
   FLYALL — TOP NAVIGATION BAR
   Reference: Hader.svg, authored at 390 x 123 (iPhone 13/14 logical width).
   Every number below is traced from that file.
   ============================================================ */

:root {
  --fa-font: 'Almoni', system-ui, sans-serif;
  --fa-ink: #1B5ECE;                 /* single UI colour: logo, avatar, points, menu */
  --fa-grad-a: #1B5ECE;
  --fa-grad-b: #824AEA;              /* stop at 50.48% */
  --fa-grad-c: #F63DE4;

  --fa-bar-h: 64px;                  /* fixed: bar height does NOT scale */
  --fa-bar-radius: 16px;
  --fa-pad: 20px;                    /* physical side padding */

  --fa-notch-w: 33.846%;             /* 132 / 390 — scales with viewport width */
  --fa-notch-ratio: 132 / 42.9006;   /* 63.7988 -> 106.6994 */
  --fa-notch-top: 63.8px;            /* meets the bar's bottom edge */

  --fa-orb-size: 25.7576%;           /* 34 / 132 of the notch — scales with it.
                                        To pin the orb at a fixed 34px instead,
                                        set: --fa-orb-size: 34px */
  --fa-orb-left: 36.29%;             /* 47.903 / 132 */
  --fa-orb-top: 3.651%;              /* 1.5664 / 42.9006 */

  /* type trims, measured against Hader.svg with Almoni */
  --fa-points-nudge: -0.767px;
  --fa-points-baseline: 13px;        /* box top -> baseline, at 16.3px/1 */
  --fa-avatar-nudge: 0.13px;
  --fa-z: 100;
}

/* ---- shell ------------------------------------------------ */
.fa-header {
  position: sticky;
  top: 0;
  z-index: var(--fa-z);
  height: var(--fa-bar-h);
  direction: ltr;                    /* the bar is NOT mirrored in RTL */
  -webkit-user-select: none;
  user-select: none;
}

/* ---- layer 0 : ambient glow + stars (behind the white bar) -- */
.fa-header__decor {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  z-index: 0;
  pointer-events: none;
}
.fa-header__decor svg { display: block; width: 100%; height: auto; }

/* ---- layer 1 : the white silhouette (bar + notch share one shadow) ---- */
.fa-header__shape {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 1;
  filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .25));
  pointer-events: none;
}
.fa-header__bar {
  height: var(--fa-bar-h);
  background: #fff;
  border-radius: 0 0 var(--fa-bar-radius) var(--fa-bar-radius);
}
.fa-header__notch {
  position: absolute;
  top: var(--fa-notch-top);
  left: 50.128%;                     /* the traced shape sits 0.5px right of centre */
  transform: translateX(-50%);
  width: var(--fa-notch-w);
  aspect-ratio: var(--fa-notch-ratio);
}
.fa-header__notch svg { display: block; width: 100%; height: 100%; }

/* the orb needs its own stacking layer: translateX(-50%) on .fa-header__notch
   makes it a stacking context, so a z-index on the child alone stays trapped inside */
.fa-header__notch--orb { z-index: 3; pointer-events: none; }

/* ---- layer 2 : controls ------------------------------------ */
.fa-header__content {
  position: relative;
  z-index: 2;
  height: var(--fa-bar-h);
}

.fa-header__left {
  position: absolute;
  left: 20.4px;
  top: 0;
  height: var(--fa-bar-h);
  display: flex;
  align-items: center;
}

/* avatar — 24px circle + 1.2px ring (outer 25.2) */
.fa-avatar {
  width: 25.2px;                     /* 24 + 1.2 ring, matching the SVG stroke */
  height: 25.2px;
  box-sizing: border-box;
  border: 1.2px solid var(--fa-ink);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--fa-ink);
  background: none;
  padding: 0;
  cursor: pointer;
}
/* traced ink: 14.590 x 7.482, centred on the circle, baseline y 35.732 */
.fa-avatar__txt {
  font: 700 11.79px/1 var(--fa-font);
  transform: translateY(var(--fa-avatar-nudge));
}

/* points — the underline means it is a link */
.fa-points {
  margin-left: 10.07px;
  display: flex;
  align-items: center;
  text-decoration: none;
  color: var(--fa-ink);
  cursor: pointer;
}
.fa-points__value {
  /* traced: ink 20.808 x 8.620 at (56.484, 27.465) · baseline y 36.085
              underline 22.320 x 0.641 at (55.674, 38.031)
     min-width pins the underline (and the coin icon after it) to the traced
     box; longer balances simply grow past it. */
  font: 700 16.3px/1 var(--fa-font);
  display: inline-block;
  position: relative;
  min-width: 22.32px;
  text-align: center;
  transform: translateY(var(--fa-points-nudge));
}
/* the underline is hung off the baseline, not off the box, so a font swap
   moves it correctly instead of silently drifting */
.fa-points__value::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  top: calc(var(--fa-points-baseline) + 1.946px);
  height: .641px;
  background: currentColor;
}

.fa-points__coins {
  margin-left: 4.63px;
  width: 18.75px;
  height: 13.75px;
  display: block;
  fill: var(--fa-ink);
}

/* logo — centred on the page, not between its neighbours */
.fa-logo {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 18.998px;
  width: 88.889px;
  height: 26.009px;
  display: block;
}

/* menu — 24 x 17.5 visual box, 20px from the right edge */
.fa-menu {
  position: absolute;
  right: var(--fa-pad);
  top: 22.498px;
  width: 24px;
  height: 17.5px;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}
.fa-menu svg { display: block; width: 100%; height: 100%; }

/* generous touch targets without changing the visuals */
.fa-avatar::after, .fa-menu::after, .fa-points::after {
  content: "";
  position: absolute;
  inset: 50% auto auto 50%;
  width: 44px; height: 44px;
  transform: translate(-50%, -50%);
}
.fa-avatar, .fa-points { position: relative; }   /* .fa-menu is already absolute */

/* ---- layer 3 : the orb (SOL) ------------------------------- */
.fa-orb {
  position: absolute;
  pointer-events: auto;
  left: var(--fa-orb-left);
  top: var(--fa-orb-top);
  width: var(--fa-orb-size);
  aspect-ratio: 1;
  border: 0;
  padding: 0;
  border-radius: 50%;
  background: #fff url("assets/orb.png") center / cover no-repeat;
  box-shadow: 0 1px 7.6px rgba(136, 73, 234, .5),
              inset 0 -1px 38.2px rgba(27, 94, 206, .11);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

@media (prefers-reduced-motion: no-preference) {
  .fa-orb { transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
  .fa-orb:active { transform: scale(.92); }
}

.fa-sr {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}

/* ============================================================
   עמוד קטגוריה — סרט כרטיסים על רקע לבן
   ============================================================ */
:root{
  --cycle: #1B5ECE 0%, #824AEA 16.667%, #F63DE4 33.333%,
           #1B5ECE 50%, #824AEA 66.667%, #F63DE4 83.333%, #1B5ECE 100%;
  --page: #FFFFFF;
  --paper:#FFFFFF;
  --notch: 30px;          /* רדיוס הצביטה בין כרטיסים */
  --perf: 18px;           /* רדיוס החריץ של קו התלישה */
  --tk-radius: 30px;
  --tk-w: min(80vw, 360px);   /* רוחב הסרט — משאיר שוליים נדיבים מסביב */
}
*{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0; background: var(--page);
  font-family:'Almoni', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
}

.cat-head{ padding: calc(var(--fa-bar-h) + 30px) clamp(20px,5vw,64px) 26px; text-align:center; }
.cat-head h1{
  margin:0;
  font:300 clamp(44px,16vw,116px)/.92 'Almoni', system-ui, sans-serif;
  letter-spacing:0; color:#000;
}
/* שם הקטגוריה יוצא מהמשקל הדק — בולד ובגרדיאנט המותג, כמו בהירו.
   nowrap כי background-clip:text על מילה שנשברת בין שורות מפצל את
   הגרדיאנט לשני קטעים שכל אחד מתחיל מחדש. */
.cat-head h1 b{
  font-weight:900; white-space:nowrap;
  background-image:linear-gradient(90deg,#1B5ECE,#824AEA 50%,#F63DE4);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.cat-head p{ margin:14px 0 0; font:400 15px/1.4 'Almoni', sans-serif; color:#6B6B6B; }

/* ——— הסרט ———
   צורה אחת רציפה, עיגול רק בשני הקצוות. לסרט עצמו אין רקע: כל חלק
   צובע את עצמו, והחיתוכים העגולים נחתכים ב-mask — כלומר הם חורים
   אמיתיים שהרקע נראה דרכם, ולא עיגולים לבנים שמצוירים מעל.
   לחור אין צל ואין עיגול משלו — רואים בו רק את הרקע. */
.strip{
  width: var(--tk-w);
  margin: 0 auto;
  border-radius: var(--tk-radius);
  overflow: hidden;
  /* צל אחד בלבד, drop-shadow, שעוקב אחרי הצורה החתוכה: בתוך החור רואים
     בדיוק את מה שרואים מחוץ לשפת הכרטיס — הרקע, עם אותו צל עדין.
     (box-shadow נמרח רק סביב המלבן, ולכן החור נראה לבן יותר מהסביבה
     ובולט כעיגול.) */
  filter: drop-shadow(0 0 1px rgba(16,16,24,.16)) drop-shadow(0 8px 26px rgba(16,16,24,.20));
}
.tk{ height: 86svh; display:flex; flex-direction:column; }

/* חור בקצה או במרכז: שקוף בתוך המעגל, אטום מחוצה לו */
.seam, .tk__perf{
  background: var(--paper);
  -webkit-mask-composite: source-in;
          mask-composite: intersect;
}

/* הצביטה בין שני כרטיסים: חצי עיגול בכל צד ועיגול קטן במרכז */
.seam{
  height: calc(var(--notch) * 2); flex:0 0 auto;
  --hole: transparent calc(var(--notch) - .5px), #000 var(--notch);
  -webkit-mask-image:
    radial-gradient(circle var(--notch) at 0 50%, var(--hole)),
    radial-gradient(circle var(--notch) at 100% 50%, var(--hole)),
    radial-gradient(circle 13px at 50% 50%, transparent 12.5px, #000 13px);
          mask-image:
    radial-gradient(circle var(--notch) at 0 50%, var(--hole)),
    radial-gradient(circle var(--notch) at 100% 50%, var(--hole)),
    radial-gradient(circle 13px at 50% 50%, transparent 12.5px, #000 13px);
}

/* ——— תוכן הכרטיס ——— */
.tk__media{ position:relative; flex:1 1 auto; min-height:0; overflow:hidden; background:#111; }
.tk__media video{ width:100%; height:100%; object-fit:cover; display:block; }
.tk__year{
  position:absolute; top:16px; left:16px;
  font:900 13px/1 'Almoni', sans-serif; letter-spacing:.9px;
  color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.45);
}
.tk__cat{
  position:absolute; top:14px; right:14px;
  height:30px; padding:0 14px; display:flex; align-items:center;
  background:#fff; border:2px solid #000; border-radius:999px;
  font:900 13px/1 'Almoni', sans-serif; letter-spacing:.9px; color:#000;
}

/* הברקוד: מלבן לבן שיושב על הסרטון */
.tk__stub{
  position:absolute; left:16px; bottom:16px;
  width:80px;                        /* קישוט בלבד — ברקוד לבן ישירות על הסרטון */
  text-align:center;
  /* צל רך בלבד, כדי שהפסים הלבנים לא ייעלמו על פריים בהיר */
  filter: drop-shadow(0 1px 3px rgba(0,0,0,.45));
}
.tk__barcode{
  height:16px; margin-bottom:4px;
  background-image:
    repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 5px),
    repeating-linear-gradient(90deg, #fff 0 2px, transparent 2px 7px);
}
.tk__code{ font:700 7px/1 ui-monospace,'SF Mono',Menlo,monospace; letter-spacing:1.2px; color:#fff; }

.tk__info{ flex:0 0 auto; background:var(--paper); padding:18px 18px 18px; text-align:center; }
.tk__name{ margin:0; font:700 clamp(32px,8.6vw,42px)/1 'Bamberger', sans-serif; letter-spacing:0; color:#000; }
.tk__where{ margin:6px 0 14px; font:400 16px/1.3 'Almoni', sans-serif; color:#5A5A5A; }
.tk__cta{
  width:100%; height:52px;
  display:flex; align-items:center; justify-content:center; gap:9px;
  border:0; border-radius:999px;
  background-image: linear-gradient(90deg, var(--cycle));
  background-size:200% 200%;
  animation: flow 3s linear infinite;
  font:900 clamp(15px,4.3vw,17px)/1 'Almoni', sans-serif; letter-spacing:.4px; color:#fff; cursor:pointer;
  white-space:nowrap;
}
.tk__cta svg{ width:16px; height:16px; fill:none; stroke:#fff; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
@keyframes flow{ from{ background-position:0% 50%; } to{ background-position:100% 50%; } }


/* ============================================================
   מצב "איך זה עובד" — הכרטיס הנבחר הופך לשחור
   העיצוב מסביב נשאר במקומו; רק הכרטיס שנבחר מתחלף.
   ============================================================ */
.tk{ transition: background .45s ease; }
.tk.is-how{ background:#0A0A0A; }
.tk.is-how .tk__media{ display:none; }
.tk.is-how .tk__info,
.tk.is-how .tk__perf{ background:#0A0A0A; }
.tk.is-how .tk__perf span{ border-top-color:rgba(255,255,255,.22); }
.tk.is-how .tk__name{ color:#fff; }
.tk.is-how .tk__where{ color:rgba(255,255,255,.6); }

.tk__how{ display:none; }
.tk.is-how .tk__how{
  display:flex; flex-direction:column;
  flex:1 1 auto; min-height:0;
  padding:48px 20px 10px;   /* אוויר גדול יותר מעל הסטיקר */
  text-align:center; color:#fff;
  touch-action:pan-y;
}

/* כל השלבים באותה תא של רשת — חופפים זה על זה, והגובה נקבע לפי הגבוה
   שבהם. כך לאזור יש גובה טבעי (ולא 0 כמו עם absolute), וזה מה שמאפשר
   למרכז את הגוש שמתחתיו במרחב שנשאר. */
.how__stage{ flex:0 0 auto; display:grid; }
.hstep{
  grid-area:1/1;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap:clamp(8px,1.6svh,16px);
  opacity:0; transform:translateY(14px) scale(.97);
  transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;
}
.hstep.is-on{ opacity:1; transform:none; pointer-events:auto; }
.hstep img{
  width:auto; height:clamp(78px,15svh,124px); display:block;
  filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));
}
.hstep h3{
  margin:0; font:900 clamp(19px,5vw,24px)/1.1 'Almoni', sans-serif;
  letter-spacing:0; color:#fff;
}
.hstep p{
  margin:0; font:400 clamp(13px,3.6vw,15px)/1.35 'Almoni', sans-serif;
  color:rgba(255,255,255,.72); max-width:30ch;
}
.hstep small{
  display:block; margin-top:2px;
  font:400 clamp(12px,3.2vw,13px)/1.3 'Almoni', sans-serif;
  color:rgba(255,255,255,.5);
}
.hstep small b{ display:block; font-weight:900; color:#fff; margin-bottom:1px; }

/* שלושה עיגולים ממוספרים — הפעיל מלא בגרדיאנט, השאר מתווים בלבד */
/* הספרות צמודות לפסקה, ושם האירוע מקבל את כל מה שנשאר ומתמרכז בו
   ב-margin:auto — כלומר בדיוק באמצע בין הספרות ל-CTA */
.how__foot{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
.how__meta{ margin:auto 0; }
.how__meta .tk__name{ margin:0; color:#fff; }
.how__meta .tk__where{ margin:6px 0 0; color:rgba(255,255,255,.6); }
.tk.is-how .tk__info .tk__name,
.tk.is-how .tk__info .tk__where{ display:none; }
.tk.is-how .tk__how{ padding-bottom:0; }
.tk.is-how .tk__info{ padding-top:0; }

.how__dots{ flex:none; display:flex; justify-content:center; gap:10px; margin-top:16px; }
.how__dots button{
  width:30px; height:30px; padding:0; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:transparent; border:1.5px solid rgba(255,255,255,.28);
  font:900 14px/1 'Almoni', sans-serif; color:rgba(255,255,255,.45);
  cursor:pointer;
  transition:background .35s ease, color .35s ease, border-color .35s ease, transform .35s cubic-bezier(.2,.8,.2,1);
}
.how__dots button.on{
  background:linear-gradient(94deg,#1B5ECE,#824AEA 52%,#F63DE4);
  border-color:transparent; color:#fff; transform:scale(1.1);
}
@media (prefers-reduced-motion: reduce){ .hstep{ transition:none; } }

/* ——— קו התלישה ———
   הגובה 120 כדי שהקו, שיושב באמצע, ינחת בדיוק במרכז הגובה שבו ישב
   הברקוד קודם: 36 של אזור התלישה ועוד 24 עד אמצע הברקוד. */
.tk__perf{
  position:relative; height:120px; flex:0 0 auto;
  --hole: transparent calc(var(--perf) - .5px), #000 var(--perf);
  -webkit-mask-image:
    radial-gradient(circle var(--perf) at 0 50%, var(--hole)),
    radial-gradient(circle var(--perf) at 100% 50%, var(--hole));
          mask-image:
    radial-gradient(circle var(--perf) at 0 50%, var(--hole)),
    radial-gradient(circle var(--perf) at 100% 50%, var(--hole));
}
.tk__perf span{ position:absolute; left:26px; right:26px; top:50%; border-top:2px dashed #D3D3D3; }

/* ——— סוף הרשימה ——— */
.tail{ width:var(--tk-w); margin:30px auto 14svh; text-align:center; }
.tail p{ margin:0 0 14px; font:400 15px/1.4 'Almoni',sans-serif; color:#6B6B6B; }
.tail a{
  display:flex; align-items:center; justify-content:center; gap:9px;
  height:56px; border-radius:999px;
  background:#fff; border:2px solid #000;
  font:900 18px/1 'Almoni',sans-serif; letter-spacing:.6px; color:#000; text-decoration:none;
}
.tail svg{ width:16px; height:16px; fill:none; stroke:#000; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }

@media (prefers-reduced-motion: reduce){ .tk__cta{ animation:none; } }
@media (prefers-reduced-motion: no-preference){
  .tk__cta, .tail a{ transition:opacity .18s ease; }
  .tk__cta:active, .tail a:active{ opacity:.8; }
}
</style>
</head>
<body>

<!-- ============ COMPONENT: FlyAll top bar ============ -->
<header class="fa-header">

  <!-- ambient glow + stars, behind the white silhouette -->
  <div class="fa-header__decor" aria-hidden="true">
    <svg viewBox="4 0 390 123" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="faGrad" x1="103" y1="0" x2="301" y2="0" gradientUnits="userSpaceOnUse">
          <stop stop-color="#1B5ECE"/>
          <stop offset="0.504808" stop-color="#824AEA"/>
          <stop offset="1" stop-color="#F63DE4"/>

  <a href="3.html">חזרה לכל הקטגוריות
    <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>
  </a>
</div>

<script>
/* ——— התוכן ———
   שמות האירועים, הערים והקודים הם תוכן לדוגמה. הכל יושב כאן, כך
   שהחלפה בדאטה אמיתי היא שינוי של המערך ולא של המבנה.
   title מפוצל לשניים: החלק הדק והמילה שיוצאת בגרדיאנט. */
const DATA = {
  shows: { title:['כל','ההופעות'], pill:'הופעות', items:[
    { name:'סלין דיון', where:'פריז · צרפת',    code:'FA 2027 01', video:'concert'  },
    { name:'קולדפליי',  where:'לונדון · אנגליה', code:'FA 2027 02', video:'audience' },
    { name:'אד שירן',   where:'ברלין · גרמניה',  code:'FA 2027 03', video:'guitar'   },
  ]},
  fest:  { title:['כל','הפסטיבלים'], pill:'פסטיבלים', items:[
    { name:'טומרולנד', where:'בום · בלגיה',    code:'FA 2027 11', video:'festival'   },
    { name:'פרימוורה', where:'ברצלונה · ספרד', code:'FA 2027 12', video:'musicfest'  },
    { name:'סונאר',    where:'ברצלונה · ספרד', code:'FA 2027 13', video:'atmosphere' },
  ]},
  sport: { title:['כל אירועי','הספורט'], pill:'ספורט', items:[
    { name:'ריאל מדריד',   where:'מדריד · ספרד',   code:'FA 2027 21', video:'football' },
    { name:'ברצלונה',      where:'ברצלונה · ספרד', code:'FA 2027 22', video:'soccer'   },
    { name:'ליגת האלופות', where:'מינכן · גרמניה', code:'FA 2027 23', video:'stadium'  },
  ]},
  ski:   { title:['כל אתרי','הסקי'], pill:'סקי', items:[
    { name:'שאמוני',    where:'שאמוני · צרפת',   code:'FA 2027 31', video:'ski'      },
    { name:'סנט אנטון', where:'טירול · אוסטריה', code:'FA 2027 32', video:'skilift'  },
    { name:'זרמאט',     where:'ואלה · שווייץ',   code:'FA 2027 33', video:'skipoles' },
  ]},
};

/* שלושת השלבים, בניסוח של הקונספט החלומי — שם הם היו אנימציות, כאן סטיקרים */
const HOW = [
  { st:'stars', t:'בוחרים חלום ומשריינים',
    p:'חופשה, הופעה או משחק שתמיד רציתם! בוחרים מועד ומשריינים במקדמה',
    nb:'20% מקדמה', n:'מהסכום הסופי, והחלום שמור לכם למועד שבחרתם' },
  { st:'coins', t:'צוברים נקודות עד לחלום',
    p:'משתמשים בכרטיס אשראי FlyAll וצוברים נקודות עד המועד שנקבע',
    nb:'1 נקודה = ₪1', n:'ככל שתצברו יותר נקודות ככה תשלמו פחות בסוף' },
  { st:'plane', t:'משלימים את היתרה ומגשימים',
    p:'משלימים את היתרה בנקודות, בכסף או גם וגם, ויוצאים להגשים את החלום',
    nb:'עד חודשיים לפני המועד', n:'מסיימים את התשלום ויוצאים לדרך' },
];

const cat = DATA[new URLSearchParams(location.search).get('c')] || DATA.shows;
document.getElementById('catTitle').innerHTML = cat.title[0] + ' <b>' + cat.title[1] + '</b>';

const arrow = '<svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>';
document.getElementById('strip').innerHTML = cat.items.map((e,i)=>`
  ${ i ? '<div class="seam"></div>' : '' }
  <article class="tk">
    <div class="tk__media">
      <video src="assets/reels/${e.video}.mp4" muted loop playsinline preload="metadata"></video>
      <span class="tk__year">2027</span>
      <span class="tk__cat">${cat.pill}</span>
      <div class="tk__stub">
        <div class="tk__barcode"></div>
        <div class="tk__code">${e.code}</div>
      </div>
    </div>
    <div class="tk__how">
      <div class="how__stage">
        ${HOW.map((h,k)=>`
          <div class="hstep${k?'':' is-on'}">
            <img src="assets/stickers/${h.st}.png" alt="">
            <h3>${h.t}</h3>
            <p>${h.p}</p>
            <small><b>${h.nb}</b>${h.n}</small>
          </div>`).join('')}
      </div>
      <div class="how__foot">
        <div class="how__dots">${HOW.map((h,k)=>`<button type="button" class="${k?'':'on'}" aria-label="שלב ${k+1}">${k+1}</button>`).join('')}</div>
        <div class="how__meta">
          <h2 class="tk__name">${e.name}</h2>
          <p class="tk__where">${e.where}</p>
        </div>
      </div>
    </div>
    <div class="tk__info">
      <h2 class="tk__name">${e.name}</h2>
      <p class="tk__where">${e.where}</p>
      <button class="tk__cta" type="button">אני רוצה להגשים את החלום הזה!${arrow}</button>
    </div>
    <div class="tk__perf"><span></span></div>
  </article>
`).join('');

/* ——— לחיצה על ה-CTA: הכרטיס הנבחר הופך לשחור ומציג את ההסבר ———
   רק אחד פתוח בכל רגע, והווידאו שלו נעצר כי הוא כבר לא נראה. */
const CTA_OPEN = 'אני רוצה להגשים את החלום הזה!';
const CTA_BUY  = 'לרכישה';

document.querySelectorAll('.tk').forEach(tk=>{
  const cta   = tk.querySelector('.tk__cta');
  const steps = [...tk.querySelectorAll('.hstep')];
  const dots  = [...tk.querySelectorAll('.how__dots button')];
  const stage = tk.querySelector('.how__stage');
  let idx = 0;

  const show = n => {
    idx = (n + steps.length) % steps.length;
    steps.forEach((s,k)=> s.classList.toggle('is-on', k===idx));
    dots.forEach((d,k)=> d.classList.toggle('on', k===idx));
  };
  dots.forEach((d,k)=> d.addEventListener('click', ()=> show(k)));

  // החלקה אופקית בין השלבים
  let x0=null;
  stage.addEventListener('pointerdown', e=>{ x0=e.clientX; });
  stage.addEventListener('pointerup', e=>{
    if(x0===null) return;
    const dx = e.clientX - x0; x0=null;
    if(Math.abs(dx) > 40) show(idx + (dx < 0 ? 1 : -1));   // rtl: שמאלה = הבא
  });

  cta.addEventListener('click', ()=>{
    if(tk.classList.contains('is-how')) return;            // "לרכישה" — אין יעד עדיין
    document.querySelectorAll('.tk.is-how').forEach(o=>{
      o.classList.remove('is-how');
      o.querySelector('.tk__cta').firstChild.textContent = CTA_OPEN;
    });
    tk.classList.add('is-how');
    cta.firstChild.textContent = CTA_BUY;
    show(0);
    tk.querySelector('video').pause();
  });
});

/* וידאו מתנגן רק כשהכרטיס שלו על המסך */
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{
    const v = e.target.querySelector('video');
    if(!v) return;
    if(e.isIntersecting){ v.preload='auto'; v.play().catch(()=>{}); } else v.pause();
  });
}, { threshold:.35 });
document.querySelectorAll('.tk').forEach(t=>io.observe(t));
</script>
