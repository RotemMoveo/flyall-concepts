/* ============================================================
   FLYALL — TOP NAVIGATION BAR
   Reference: Hader.svg, authored at 390 x 123 (iPhone 13/14 logical width).
   Every number below is traced from that file.
   ============================================================ */

:root {
  --fa-font: 'Ploni', system-ui, sans-serif;
  --fa-ink: #1B5ECE;                 /* single UI colour: logo, avatar, points, menu */
  --fa-grad-a: #1B5ECE;
  --fa-grad-b: #824AEA;              /* stop at 50.48% */
  --fa-grad-c: #F63DE4;

  --fa-bar-h: 64px;                  /* fixed: bar height does NOT scale */
  --fa-bar-radius: 16px;
  --fa-pad: 20px;                    /* physical side padding */

  --fa-notch-w: 33.846%;             /* 132 / 390 — scales with viewport width */
  --fa-notch-ratio: 132 / 42.9006;   /* 63.7988 -> 106.6994 */
  --fa-notch-top: 63.8px;            /* meets the bar's bottom edge */

  --fa-orb-size: 25.7576%;           /* 34 / 132 of the notch — scales with it.
                                        To pin the orb at a fixed 34px instead,
                                        set: --fa-orb-size: 34px */
  --fa-orb-left: 36.29%;             /* 47.903 / 132 */
  --fa-orb-top: 3.651%;              /* 1.5664 / 42.9006 */

  /* type trims, measured against Hader.svg with Ploni */
  --fa-points-nudge: -0.767px;
  --fa-points-baseline: 13px;        /* box top -> baseline, at 16.3px/1 */
  --fa-avatar-nudge: 0.13px;
  --fa-z: 100;
}

/* ---- shell ------------------------------------------------ */
.fa-header {
  position: sticky;
  top: 0;
  z-index: var(--fa-z);
  height: var(--fa-bar-h);
  direction: ltr;                    /* the bar is NOT mirrored in RTL */
  -webkit-user-select: none;
  user-select: none;
}

/* ---- layer 0 : ambient glow + stars (behind the white bar) -- */
.fa-header__decor {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  z-index: 0;
  pointer-events: none;
}
.fa-header__decor svg { display: block; width: 100%; height: auto; }

/* ---- layer 1 : the white silhouette (bar + notch share one shadow) ---- */
.fa-header__shape {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 1;
  filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .25));
  pointer-events: none;
}
.fa-header__bar {
  height: var(--fa-bar-h);
  background: #fff;
  border-radius: 0 0 var(--fa-bar-radius) var(--fa-bar-radius);
}
.fa-header__notch {
  position: absolute;
  top: var(--fa-notch-top);
  left: 50.128%;                     /* the traced shape sits 0.5px right of centre */
  transform: translateX(-50%);
  width: var(--fa-notch-w);
  aspect-ratio: var(--fa-notch-ratio);
}
.fa-header__notch svg { display: block; width: 100%; height: 100%; }

/* the orb needs its own stacking layer: translateX(-50%) on .fa-header__notch
   makes it a stacking context, so a z-index on the child alone stays trapped inside */
.fa-header__notch--orb { z-index: 3; pointer-events: none; }

/* ---- layer 2 : controls ------------------------------------ */
.fa-header__content {
  position: relative;
  z-index: 2;
  height: var(--fa-bar-h);
}

.fa-header__left {
  position: absolute;
  left: 20.4px;
  top: 0;
  height: var(--fa-bar-h);
  display: flex;
  align-items: center;
}

/* avatar — 24px circle + 1.2px ring (outer 25.2) */
.fa-avatar {
  width: 25.2px;                     /* 24 + 1.2 ring, matching the SVG stroke */
  height: 25.2px;
  box-sizing: border-box;
  border: 1.2px solid var(--fa-ink);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--fa-ink);
  background: none;
  padding: 0;
  cursor: pointer;
}
/* traced ink: 14.590 x 7.482, centred on the circle, baseline y 35.732 */
.fa-avatar__txt {
  font: 700 11.79px/1 var(--fa-font);
  transform: translateY(var(--fa-avatar-nudge));
}

/* points — the underline means it is a link */
.fa-points {
  margin-left: 10.07px;
  display: flex;
  align-items: center;
  text-decoration: none;
  color: var(--fa-ink);
  cursor: pointer;
}
.fa-points__value {
  /* traced: ink 20.808 x 8.620 at (56.484, 27.465) · baseline y 36.085
              underline 22.320 x 0.641 at (55.674, 38.031)
     min-width pins the underline (and the coin icon after it) to the traced
     box; longer balances simply grow past it. */
  font: 700 16.3px/1 var(--fa-font);
  display: inline-block;
  position: relative;
  min-width: 22.32px;
  text-align: center;
  transform: translateY(var(--fa-points-nudge));
}
/* the underline is hung off the baseline, not off the box, so a font swap
   moves it correctly instead of silently drifting */
.fa-points__value::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  top: calc(var(--fa-points-baseline) + 1.946px);
  height: .641px;
  background: currentColor;
}

.fa-points__coins {
  margin-left: 4.63px;
  width: 18.75px;
  height: 13.75px;
  display: block;
  fill: var(--fa-ink);
}

/* logo — centred on the page, not between its neighbours */
.fa-logo {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 18.998px;
  width: 88.889px;
  height: 26.009px;
  display: block;
}

/* menu — 24 x 17.5 visual box, 20px from the right edge */
.fa-menu {
  position: absolute;
  right: var(--fa-pad);
  top: 22.498px;
  width: 24px;
  height: 17.5px;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}
.fa-menu svg { display: block; width: 100%; height: 100%; }

/* generous touch targets without changing the visuals */
.fa-avatar::after, .fa-menu::after, .fa-points::after {
  content: "";
  position: absolute;
  inset: 50% auto auto 50%;
  width: 44px; height: 44px;
  transform: translate(-50%, -50%);
}
.fa-avatar, .fa-points { position: relative; }   /* .fa-menu is already absolute */

/* ---- layer 3 : the orb (SOL) ------------------------------- */
.fa-orb {
  position: absolute;
  pointer-events: auto;
  left: var(--fa-orb-left);
  top: var(--fa-orb-top);
  width: var(--fa-orb-size);
  aspect-ratio: 1;
  border: 0;
  padding: 0;
  border-radius: 50%;
  background: #fff url("assets/orb.png") center / cover no-repeat;
  box-shadow: 0 1px 7.6px rgba(136, 73, 234, .5),
              inset 0 -1px 38.2px rgba(27, 94, 206, .11);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

@media (prefers-reduced-motion: no-preference) {
  .fa-orb { transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
  .fa-orb:active { transform: scale(.92); }
}

.fa-sr {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}



/* ============================================================
   P.O.V. — direction D (Arc). Type: Ploni AAA (200–900).
   ============================================================ */
:root{
  --fa-display: var(--fa-font);
  --stage-h: calc(100svh - var(--fa-bar-h));
  --notch-clear: 48px;            /* the header tongue hangs 43px below the bar */
  --ease: cubic-bezier(.22,.9,.24,1);
  --ink: #1A1140;

  /* the dream palette — the three brand hues, and the pale tint ramp the
     page background is built from. The blooms stay barely-there tints: the
     light, happy backdrop is the point, not the colour. */
  --c-blue:    #1862D9;
  --c-purple:  #8A4BF3;
  --c-magenta: #FC3DE0;
  --t-sky-1:   #EFEDFF;
  --t-sky-2:   #F7F0FB;
  --t-sky-3:   #FBF1FA;
  --t-sky-4:   #FFF6ED;
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none;background:#fff}
body{position:relative}   /* the backdrop stretches over the whole document */
body{font-family:var(--fa-display);color:#fff}
img,video{display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;background:#fff}
#stage{position:relative;z-index:1}
.scrim{position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(to top, rgba(6,7,16,.92) 0%, rgba(6,7,16,.56) 34%, rgba(6,7,16,0) 68%),
            linear-gradient(to bottom, rgba(6,7,16,.42) 0%, transparent 26%)}
.kicker{font:700 10px/1 var(--fa-display);letter-spacing:0;opacity:.7}
.meta{font-weight:400;font-size:12.5px;line-height:1.2;opacity:.66}
.title{font-weight:700;letter-spacing:0;line-height:1;margin:2px 0}
.cta{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;
 font-weight:700;letter-spacing:-.01em;border-radius:999px;white-space:nowrap;
 transition:transform .18s var(--ease)}
.cta:active{transform:scale(.97)}

/* ============ D · ARC ============ */
.arc{display:flex;flex-direction:column;padding-bottom:0}
/* 917 artboard = 64 bar + 90 + 156 (headline) + 53 + 443 (card) + 20 + 91 */
.arc .lead{padding:90px 20px 0;text-align:center;color:var(--ink)}
.arc h2{margin:0;font-size:77.7px;line-height:1;letter-spacing:0}
.arc .l1{display:block;font-weight:300}
.arc .l2{display:block;font-weight:300}
.arc .l2 b{font-weight:700}
.arc .track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
 overflow-y:hidden;
 padding:53px calc(50% - 36vw) 58px;scrollbar-width:none;align-items:center}
.arc .track::-webkit-scrollbar{display:none}
.arc .cell{flex:none;width:72vw;aspect-ratio:9/14.2;scroll-snap-align:center;
 border-radius:24px;overflow:hidden;position:relative;background:#11121C;
 transition:filter .4s var(--ease), opacity .4s var(--ease);will-change:transform;
 border:1.5px solid rgba(255,255,255,.72);
 box-shadow:0 26px 50px rgba(58,26,124,.32)}
.arc video{width:100%;height:100%;object-fit:cover}
.arc .copy{position:absolute;right:16px;left:16px;bottom:16px;text-align:right;
 opacity:0;transition:opacity .35s var(--ease)}
.arc .cell.mid .copy{opacity:1}
.arc .logos{display:flex;align-items:center;justify-content:flex-start;gap:16px;
 margin-bottom:16px;min-height:133px}
.arc .logos img{max-height:133px;max-width:100%;width:auto;height:auto;display:block;
 filter:drop-shadow(0 8px 22px rgba(6,7,16,.55))}
.arc .logos.duo{gap:10px}
.arc .logos.duo img{max-height:115px;max-width:40%}
.arc .logos em{font-style:normal;font-weight:300;font-size:46px;line-height:1;
 opacity:.85;flex:none;filter:drop-shadow(0 6px 16px rgba(6,7,16,.55))}
.arc .event{font-weight:700;font-size:17px;line-height:1.15;letter-spacing:0;margin:0}
.arc .cta{margin-top:10px;height:48px;font-size:15px;background:#fff;color:#0B0C16}

/* ============ SECTION 3 · the question + four categories ============ */
.ask{padding:112px 14px 90px}
/* the sentence AND the four windows share one dark band. It runs edge to edge
   because the longest line is 359px and the type is not negotiable — an inset
   card would leave the words touching its corners. */
.ask__panel{margin-inline:-14px;padding:96px 10px 104px;border-radius:28px;
 background:
  radial-gradient(42% 9%  at 82%  3%, #FFDCF3 0%, rgba(255,220,243,0) 70%),
  radial-gradient(38% 8%  at 10%  9%, #D6ECFF 0%, rgba(214,236,255,0) 72%),
  radial-gradient(46% 8%  at 58% 17%, #EDE4FF 0%, rgba(237,228,255,0) 70%),
  radial-gradient(40% 9%  at  6% 26%, #FFE7CE 0%, rgba(255,231,206,0) 72%),
  radial-gradient(44% 8%  at 90% 33%, #FFD9F0 0%, rgba(255,217,240,0) 70%),
  radial-gradient(40% 9%  at 28% 41%, #D9EAFF 0%, rgba(217,234,255,0) 72%),
  radial-gradient(46% 8%  at 72% 50%, #F1E4FF 0%, rgba(241,228,255,0) 70%),
  radial-gradient(38% 9%  at 12% 59%, #FFE9D6 0%, rgba(255,233,214,0) 72%),
  radial-gradient(44% 8%  at 86% 67%, #E4E8FF 0%, rgba(228,232,255,0) 70%),
  radial-gradient(42% 9%  at 34% 76%, #FFDFF0 0%, rgba(255,223,240,0) 72%),
  radial-gradient(46% 9%  at 68% 85%, #E9F1FF 0%, rgba(233,241,255,0) 70%),
  radial-gradient(44% 10% at 18% 95%, #FFEEDC 0%, rgba(255,238,220,0) 72%),
  linear-gradient(180deg,var(--t-sky-1) 0%, var(--t-sky-2) 34%, var(--t-sky-3) 62%, var(--t-sky-4) 100%)}
/* the windows keep the 36px inset they had before the band wrapped them */
.ask__panel > .deck{padding:0 26px}
.ask__line{margin:0;text-align:center;font-size:min(73px,19.5vw);line-height:1.06;
 letter-spacing:0;
 color:var(--ink)}
/* the break points are authored, not wrapped */
.ask__line span{display:block;white-space:nowrap}
.perks__head .ln{display:block;white-space:nowrap}
.ask__line .w{display:inline-block;font-style:normal;will-change:opacity,transform;color:var(--ink)}
.ask__line .t{font-weight:300}
.ask__line .b{font-weight:700}
/* the ramp is painted into the glyphs; each word gets its own slice of one
   block-wide gradient, so the two lines read as a single sweep */
.ask__line .b .w{
 padding:.2em 0;margin:-.2em 0;
 background-image:linear-gradient(104deg,var(--c-blue) 0%, #E0409F 52%, var(--c-purple) 100%);
 background-repeat:no-repeat;
 -webkit-background-clip:text;background-clip:text;color:transparent}

.deck{display:flex;flex-direction:column;gap:24px;margin-top:66px;padding:0 22px}
.tile{position:relative;will-change:transform,opacity;
 opacity:0;transform:var(--from,none);
 transition:opacity 1.25s var(--ease) var(--d,0s), transform 1.5s var(--ease) var(--d,0s)}
.tile.in{opacity:1;transform:var(--to,none)}
@media (prefers-reduced-motion: reduce){ .tile{opacity:1;transform:none;transition:none} }
.tile__v{position:relative;aspect-ratio:16/7.8;border-radius:20px;overflow:hidden;
 background:#11121C;border:1.5px solid rgba(6,7,15,.72);
 box-shadow:0 14px 26px rgba(58,26,124,.24)}
.tile__v video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* an even wash, dipped at both ends, so the title holds anywhere in the frame */
.tile__v::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(180deg,rgba(6,7,16,.62) 0%,rgba(6,7,16,.34) 46%,rgba(6,7,16,.58) 100%)}
.tile h3{position:absolute;z-index:2;top:16px;right:18px;left:18px;margin:0;
 text-align:right;font-weight:700;font-size:32px;letter-spacing:-.02em;line-height:1.05;
 color:#fff;text-shadow:0 2px 14px rgba(6,7,16,.5)}
@media (prefers-reduced-motion: reduce){ .tile{transform:none!important} }

/* ============ THE EXPERIENCE · full-frame, reel style ============ */
body.reel-open{overflow:hidden}
.reel{position:fixed;inset:0;z-index:1000;background:#06070F;
 opacity:0;visibility:hidden;transition:opacity .4s var(--ease), visibility .4s var(--ease)}
.reel.open{opacity:1;visibility:visible}
.reel__track{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;
 scroll-snap-type:x mandatory;scrollbar-width:none}
.reel__track::-webkit-scrollbar{display:none}
.reel__slide{position:relative;flex:none;width:100%;height:100%;scroll-snap-align:center;
 overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.reel__slide::-webkit-scrollbar{display:none}
/* the footage stays put while the sheet climbs over it */
.reel__stage{position:sticky;top:0;height:100%;z-index:1}

/* the black sheet: its own top edge is the fade the video shows through */
.reel__veil{position:absolute;inset:0;z-index:3;pointer-events:none;
 background:linear-gradient(to bottom,
   rgba(6,7,16,0) 0%, rgba(6,7,16,0) 59%, rgba(6,7,16,.45) 64%,
   rgba(6,7,16,.88) 70%, #06070F 77%, #06070F 100%);
 background-size:100% 200%;background-repeat:no-repeat;background-position:0 0}
.reel__detail{position:relative;z-index:4;padding:26vh 22px 132px;color:#fff;background:none;
 pointer-events:none}
.rd__kicker{margin:0;font-weight:400;font-size:13px;letter-spacing:.18em;opacity:.5;text-align:right}
.rd__title{margin:8px 0 0;font-weight:700;font-size:44px;line-height:1.02;
 letter-spacing:-.03em;text-align:right}
.rd__about{margin:14px 0 0;font-weight:300;font-size:17px;line-height:1.5;opacity:.82;text-align:right}
.rd__h{margin:34px 0 12px;font-weight:700;font-size:15px;letter-spacing:.1em;opacity:.55;text-align:right}
.rd__chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start}
.rd__chips span{height:38px;padding:0 15px;border-radius:999px;display:grid;place-items:center;
 font-weight:400;font-size:15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.rd__packs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.rd__packs li{display:flex;align-items:center;justify-content:space-between;gap:14px;
 padding:15px 17px;border-radius:16px;background:rgba(255,255,255,.07);
 border:1px solid rgba(255,255,255,.12)}
.rd__packs b{font-weight:700;font-size:17px}
.rd__packs span{font-weight:400;font-size:16px;opacity:.72;white-space:nowrap}
.reel__act{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:16px 22px 22px;
 opacity:0;transform:translateY(14px);pointer-events:none;
 background:linear-gradient(to top,#06070F 42%,rgba(6,7,16,0) 100%);
 transition:opacity .35s var(--ease), transform .45s var(--ease)}
.reel__act.show{opacity:1;transform:none;pointer-events:auto}
.rd__cta{width:100%;height:58px;border-radius:999px;
 display:flex;align-items:center;justify-content:center;gap:9px;
 font-weight:700;font-size:18px;color:#fff;
 background:linear-gradient(94deg,var(--c-blue),var(--c-purple) 52%,var(--c-magenta));
 box-shadow:0 14px 34px rgba(138,75,243,.5);
 transition:transform .18s var(--ease)}
.rd__cta:active{transform:scale(.97)}
.reel__hint{transition:opacity .3s var(--ease)}
.reel__v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* one segment per experience — the same set the carousel holds */
.reel__bars{position:absolute;top:14px;left:14px;right:14px;z-index:3;display:flex;gap:4px}
.reel__bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);
 transition:background .3s var(--ease)}
.reel__bars i.on{background:#fff}

/* the card's own copy, carried onto the full frame */
.reel__copy{position:absolute;right:20px;left:20px;bottom:92px;z-index:2;text-align:right;color:#fff;
 transform-origin:100% 100%;transform:scale(.7);opacity:0;
 transition:transform .8s var(--ease), opacity .5s var(--ease)}
.reel__slide.live .reel__copy{transform:none;opacity:1}
@media (prefers-reduced-motion: reduce){ .reel__copy{transform:none;opacity:1;transition:none} }
.reel__copy .logos{display:flex;align-items:center;justify-content:flex-start;gap:18px;
 margin-bottom:20px;min-height:170px}
.reel__copy .logos img{max-height:170px;max-width:100%;width:auto;height:auto;display:block;
 filter:drop-shadow(0 8px 22px rgba(6,7,16,.6))}
.reel__copy .logos.duo{gap:12px}
.reel__copy .logos.duo img{max-height:146px;max-width:40%}
.reel__copy .logos em{font-style:normal;font-weight:300;font-size:56px;line-height:1;opacity:.85}
.reel__copy .event{font-weight:700;font-size:22px;line-height:1.15;margin:0}
/* the dark rise at the foot of the frame */
.reel__foot{position:absolute;left:0;right:0;bottom:0;height:42%;pointer-events:none;
 background:linear-gradient(to top,rgba(6,7,16,.94) 0%,rgba(6,7,16,.72) 28%,
   rgba(6,7,16,.34) 58%,rgba(6,7,16,0) 100%)}
.reel__hint{position:absolute;left:0;right:0;bottom:28px;display:grid;place-items:center;
 color:#fff;opacity:.9;pointer-events:none}
.reel__hint svg{display:block;animation:hintNudge 1.9s var(--ease) infinite}
@keyframes hintNudge{
  0%,100%{transform:translateY(0);opacity:.55}
  45%{transform:translateY(9px);opacity:1}
}
.reel__close{position:absolute;top:16px;right:16px;z-index:6;width:44px;height:44px;border-radius:50%;
 display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14);
 border:1px solid rgba(255,255,255,.22);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 transition:transform .2s var(--ease)}
.reel__close:active{transform:scale(.92)}
@media (prefers-reduced-motion: reduce){ .reel__hint svg{animation:none} }

/* ============ HOW IT WORKS · the three-step walkthrough ============ */
/* The veil grows: only a strip at the very top stays clear, so the footage
   keeps running behind the headline of the screen and everything else is flat
   black for the walkthrough to sit on. */
.how{position:absolute;inset:0;z-index:20;opacity:0;visibility:hidden;
 transition:opacity .45s var(--ease), visibility .45s var(--ease)}
.reel.how-open .how{opacity:1;visibility:visible}
.how__veil{position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(to bottom,
   rgba(6,7,15,0) 0%, rgba(6,7,15,.14) 7%, rgba(6,7,15,.72) 16%,
   #06070F 24%, #06070F 100%)}
/* while the walkthrough is up the reel's own furniture steps aside */
.reel.how-open .reel__veil,
.reel.how-open .reel__detail,
.reel.how-open .reel__act,
.reel.how-open .reel__copy,
.reel.how-open .reel__hint,
.reel.how-open .reel__foot,
.reel.how-open .reel__bars{opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.reel.how-open .reel__slide{overflow:hidden}
.reel.how-open .reel__track{overflow:hidden}

.how__track{position:absolute;left:0;right:0;top:25%;bottom:0;z-index:2;
 display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
 scrollbar-width:none;overscroll-behavior:contain}
.how__track::-webkit-scrollbar{display:none}
.how__step{flex:none;width:100%;height:100%;scroll-snap-align:center;
 display:flex;flex-direction:column;align-items:center;padding:6px 24px 92px}

.how__art{flex:none;display:flex;justify-content:center;width:100%}
.how__art svg{width:100%;max-width:268px;height:auto;max-height:27vh;
 fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* auto margin, so the copy is pinned to the bottom whatever the art's height */
.how__copy{margin-top:auto;text-align:center;color:#fff;padding-top:18px;width:100%}
.how__copy h3{margin:0 0 10px;font-weight:700;font-size:34px;line-height:1.08;
 letter-spacing:-.02em;color:var(--tone-fg)}
.how__copy p{margin:0 0 5px;font-weight:300;font-size:17px;line-height:1.45;opacity:.82}

/* the highlighted line each step ends on */
.how__note{margin-top:16px;border-radius:16px;padding:13px 16px;
 background:var(--tone-bg);border:1px solid var(--tone-br)}
.how__note b{display:block;font-weight:700;font-size:19px;color:var(--tone-fg)}
.how__note span{display:block;margin-top:3px;font-weight:300;font-size:14px;
 line-height:1.4;opacity:.78}

.how__cta{width:100%;height:56px;margin-top:16px;border-radius:999px;
 display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;
 background:linear-gradient(94deg,var(--c-blue),var(--c-purple) 52%,var(--c-magenta));
 box-shadow:0 12px 30px rgba(138,75,243,.42);
 transition:transform .18s var(--ease)}
.how__cta:active{transform:scale(.97)}

/* one accent per step — lifted off the brand ramp, but opened up enough to
   hold its own on black */
.tone-blue   {--tone-fg:#6BA6FF;--tone-bg:rgba(77,141,245,.13);--tone-br:rgba(77,141,245,.3)}
.tone-purple {--tone-fg:#B48BFF;--tone-bg:rgba(138,75,243,.15);--tone-br:rgba(138,75,243,.34)}
.tone-magenta{--tone-fg:#FF84EE;--tone-bg:rgba(252,61,224,.13);--tone-br:rgba(252,61,224,.3)}

.how__dots{position:absolute;left:0;right:0;bottom:44px;z-index:3;
 display:flex;justify-content:center;gap:8px;pointer-events:none}
.how__dots i{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.28);
 transition:width .35s var(--ease), background .35s var(--ease)}
.how__dots i.on{width:26px;background:#fff}
.how__close{position:absolute;top:16px;right:16px;z-index:4;width:44px;height:44px;
 border-radius:50%;display:grid;place-items:center;color:#fff;
 background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 transition:transform .2s var(--ease)}
.how__close:active{transform:scale(.92)}

/* ---- step 1 · the hand picking one of four ---- */
.hand{animation:handPick 5s var(--ease) infinite alternate}
@keyframes handPick{
  0%      {transform:translate(147px,42px)}
  6%,13%  {transform:translate(147px,32px)}
  20%     {transform:translate(147px,42px)}
  27%     {transform:translate(39px,42px)}
  31%,38% {transform:translate(39px,32px)}
  45%     {transform:translate(39px,42px)}
  52%     {transform:translate(39px,150px)}
  56%,63% {transform:translate(39px,140px)}
  70%     {transform:translate(39px,150px)}
  77%     {transform:translate(147px,150px)}
  81%,88% {transform:translate(147px,140px)}
  95%,100%{transform:translate(147px,150px)}
}
.pick{fill:rgba(255,255,255,.16);stroke:none;opacity:0;
 animation:none 5s linear infinite alternate}
.pickA{animation-name:pickA} .pickB{animation-name:pickB}
.pickC{animation-name:pickC} .pickD{animation-name:pickD}
@keyframes pickA{0%,4%{opacity:0}  7%,19%{opacity:1} 22%,100%{opacity:0}}
@keyframes pickB{0%,29%{opacity:0} 32%,44%{opacity:1} 47%,100%{opacity:0}}
@keyframes pickC{0%,54%{opacity:0} 57%,69%{opacity:1} 72%,100%{opacity:0}}
@keyframes pickD{0%,79%{opacity:0} 82%,94%{opacity:1} 97%,100%{opacity:0}}

/* ---- step 2 · the approval drawing itself on the card ---- */
.ok__ring{stroke-dasharray:189;stroke-dashoffset:189}
.ok__tick{stroke-dasharray:50;stroke-dashoffset:50}
.how__step.play .ok__ring{animation:drawRing 1s var(--ease) .3s forwards}
.how__step.play .ok__tick{animation:drawTick .42s var(--ease) 1.15s forwards}
@keyframes drawRing{to{stroke-dashoffset:0}}
@keyframes drawTick{to{stroke-dashoffset:0}}

/* ---- step 3 · the clouds going past the window ---- */
.cloud{animation:drift linear infinite}
.cloud--a{animation-duration:9s;animation-delay:-1s}
.cloud--b{animation-duration:13s;animation-delay:-6s}
.cloud--c{animation-duration:11s;animation-delay:-9s}
@keyframes drift{from{transform:translateX(210px)}to{transform:translateX(-130px)}}
/* filled in the backdrop's own colour, and painted after the clouds, so the
   weather passes behind it instead of showing through */
.wing,.handfill{fill:#06070F}
.handfill{stroke:none}

@media (prefers-reduced-motion: reduce){
  .hand,.pick,.cloud{animation:none}
  .ok__ring,.ok__tick{stroke-dashoffset:0}
}

/* ============ SECTION 4 · what else the points buy ============ */
.perks{padding:50px 0 84px}
.perks__head{padding:0 22px;text-align:right}
.perks__head h2{margin:0;font-weight:300;font-size:64px;line-height:1.04;
 letter-spacing:0;color:var(--ink)}
.perks__head b{font-weight:700}
.perks__nav{display:flex;gap:10px;margin-top:28px;padding:0 22px;justify-content:flex-start}
/* bare arrows, no pill — the button box stays a 48px tap target */
.perks__nav button{width:48px;height:48px;display:grid;place-items:center;
 background:none;border:0;padding:0;color:#000;
 transition:opacity .25s var(--ease), transform .2s var(--ease)}
.perks__nav button:active{transform:scale(.95)}
.perks__nav button:disabled{opacity:.35}

.perks__rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
 scroll-behavior:smooth;scrollbar-width:none;margin-top:26px;padding:0 22px}
.perks__rail::-webkit-scrollbar{display:none}
.perk{flex:none;width:76%;aspect-ratio:9/13;scroll-snap-align:start;position:relative;
 border-radius:20px;overflow:hidden;background:#11121C;
 border:1.5px solid rgba(255,255,255,.72);
 box-shadow:0 18px 38px rgba(58,26,124,.30)}
.perk video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* a colour wash rising out of the bottom edge, the way the reference carries its copy */
.perk__wash{position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(to top, var(--wash-a) 0%, var(--wash-b) 34%, transparent 72%)}
.perk__copy{position:absolute;right:18px;left:18px;bottom:18px;text-align:right;color:#fff}
.perk__copy b{display:block;font-weight:700;font-size:25px;letter-spacing:-.025em;line-height:1.1}
.perk__copy span{display:block;font-weight:400;font-size:16px;opacity:.88;margin-top:3px}
/* the price, in both currencies, separated by a hairline rule */
.perk__price{display:flex;align-items:baseline;justify-content:flex-start;gap:9px;
 margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.22)}
.perk__price i{font-style:normal;font-weight:700;font-size:21px;letter-spacing:-.02em}
.perk__price em{font-style:normal;font-weight:300;font-size:15px;opacity:.78}

/* ============ SECTION 5 · footer ============ */
/* No surface of its own — the page's light gradient keeps running underneath. */
.foot{padding:0 0 34px;color:var(--ink)}
.foot a{text-decoration:none}

/* ---- brand, links, social ---- */
.foot__brand{padding:0 22px;display:flex;align-items:center;gap:13px}
.foot__brand svg{display:block;width:89px;height:26px;flex:none}
.foot__brand p{margin:0;font-weight:400;font-size:13px;line-height:1.35;opacity:.55}

.foot__cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
 padding:38px 22px 0;text-align:right}
.foot__cols h4{margin:0 0 10px;font-weight:700;font-size:15px;letter-spacing:-.02em}
.foot__cols a{display:block;font-weight:400;font-size:14px;line-height:1.95;
 color:var(--ink);opacity:.6;transition:opacity .2s var(--ease)}
.foot__cols a:active{opacity:1}

.foot__social{display:flex;gap:10px;padding:34px 22px 0;justify-content:flex-start}
.foot__social a{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
 color:var(--ink);background:rgba(26,17,64,.07);
 transition:background .25s var(--ease), transform .2s var(--ease)}
.foot__social a:active{transform:scale(.92)}
.foot__social svg{display:block}

/* ---- legal ---- */
.foot__rule{height:1px;margin:34px 22px 0;background:rgba(26,17,64,.12)}
.foot__legal{padding:18px 22px 0;text-align:right}
.foot__legal nav{display:flex;flex-wrap:wrap;gap:4px 16px}
.foot__legal nav a{font-weight:400;font-size:13px;color:var(--ink);opacity:.6}
.foot__legal small{display:block;margin-top:14px;font-weight:300;font-size:12px;
 line-height:1.6;opacity:.45}

/* ---------- entry animation: time-based, fired on arrival ----------
   Everything that should float in starts here and is released by an
   IntersectionObserver when its section actually reaches the screen. */
.en{opacity:0;transform:translateY(30px);
 transition:opacity .72s var(--ease) var(--d,0s), transform .9s var(--ease) var(--d,0s)}
.en.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){ .en{opacity:1;transform:none;transition:none} }

/* ---------- staged reveal of the page underneath ---------- */
.rv{opacity:0;transform:translateY(24px);
 transition:opacity .75s var(--ease), transform .85s var(--ease)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){ .rv{opacity:1;transform:none} }

</style>

<script>
const ARC   = [{"src": "POV%20Videos/0_Skier_Ski_Lift_720x1280.mp4", "logos": ["ski-trek.png"], "event": "סקי בזרמט · שוויץ"}, {"src": "POV%20Videos/0_Skier_Skiing_720x1280.mp4", "logos": ["ski-trek.png"], "event": "סקי בשאמוני · האלפים"}, {"src": "POV%20Videos/0_Football_Soccer_720x1280.mp4", "logos": ["barcelona.png", "real-madrid.png"], "event": "אל קלאסיקו · מדריד"}, {"src": "POV%20Videos/0_Concert_Crowd_720x1280.mp4", "logos": ["celine-dion.png"], "event": "סלין דיון · וומבלי"}, {"src": "POV%20Videos/0_Festival_Music_Festival_720x1280.mp4", "logos": ["tomorrowland.png"], "event": "טומורולנד · בלגיה"}, {"src": "POV%20Videos/0_Football_Stadium_720x1280.mp4", "logos": ["champions-league.png"], "event": "ליל האלופות · סן סירו"}];

const pool = new Map();
function getVideo(src, preload){
  let v = pool.get(src);
  if(!v){
    v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('playsinline',''); v.setAttribute('muted','');
    v.preload = preload || 'auto'; v.src = src;
    pool.set(src, v);
  }
  return v;
}
const stopAll = () => pool.forEach(v => v.pause());
function freshVideo(src, preload){          /* never shared — a node lives in one place */
  const v = document.createElement('video');
  v.muted = true; v.loop = true; v.playsInline = true;
  v.setAttribute('playsinline',''); v.setAttribute('muted','');
  v.preload = preload || 'metadata'; v.src = src;
  return v;
}
const play = v => { const p = v.play(); if(p && p.catch) p.catch(()=>{}); };
/* Entry animations are registered while the page is built but stay disarmed
   until the intro is over, so nothing plays behind the loading screen.
   Each group re-plays every time its section comes back into view. */
const _entries = [];
function enter(root, items, stepMs, useDefaultMotion){
  items.forEach((n, i) => {
    if (useDefaultMotion !== false) n.classList.add('en');
    n.style.setProperty('--d', (i * stepMs / 1000).toFixed(2) + 's');
  });
  _entries.push(() => {
    const io = new IntersectionObserver(es => es.forEach(e => {
      items.forEach(n => n.classList.toggle('in', e.isIntersecting));
    }), { threshold: 0, rootMargin: '-14% 0px -14% 0px' });
    io.observe(root);
  });
}
function armEntries(){ _entries.forEach(fn => fn()); _entries.length = 0; }

const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
function cta(cls){
  const b = el('button','cta '+(cls||''));
  b.innerHTML = '<span>'+CTA_LABEL+'</span>'+ARROW;
  return b;
}

/* ================= D · ARC ================= */
function buildArc(){
  let armed = false;               /* nothing plays behind the intro */
  const root = el('div','arc');
  root.appendChild(el('div','lead',
    '<h2><span class="l1">מה החלום</span><span class="l2">שלך <b>היום?</b></span></h2>'));
  const track = el('div','track');
  ARC.forEach(d=>{
    const c = el('div','cell');
    c.appendChild(getVideo(d.src));
    c.appendChild(el('div','scrim'));
    const logos = d.logos.map(f => '<img src="assets/logos/'+f+'" alt="">')
                          .join(d.logos.length > 1 ? '<em>&amp;</em>' : '');
    const cp = el('div','copy',
      '<div class="logos'+(d.logos.length > 1 ? ' duo' : '')+'">'+logos+'</div>'+
      '<div class="event">'+d.event+'</div>');
    cp.appendChild(cta());
    c.appendChild(cp);
    c.style.cursor = 'pointer';
    c.addEventListener('click', () => openReel(ARC.indexOf(d)));
    track.appendChild(c);
  });
  root.appendChild(track);
  function shape(){
    const mid = track.getBoundingClientRect().left + track.clientWidth/2;
    [...track.children].forEach(c=>{
      const r = c.getBoundingClientRect();
      const p = ((r.left + r.width/2) - mid) / r.width;
      const a = Math.min(Math.abs(p), 2.4);
      const ty = Math.pow(Math.min(a, 1.35), 2) * 26;   /* capped: the rail must not overflow */
      c.style.transform = 'translateY('+ty+'px) rotate('+(p*-7)+'deg) scale('+(1-a*.1)+')';
      c.classList.toggle('mid', a < .35);
      c.style.opacity = a < .35 ? 1 : Math.max(.42, 1 - a*.42);
      const v = c.querySelector('video');
      if (armed) { a < 1.4 ? play(v) : v.pause(); }
    });
  }
  track.addEventListener('scroll', ()=>requestAnimationFrame(shape), {passive:true});
  requestAnimationFrame(()=>{
    /* centre the second card by nudging the rail itself — scrollIntoView would
       drag the whole page down now that the layout is taller than the screen */
    const cell = track.children[1];
    const cr = cell.getBoundingClientRect(), tr = track.getBoundingClientRect();
    track.scrollLeft += (cr.left + cr.width/2) - (tr.left + tr.width/2);
    shape();
  });
  enter(root, [root.querySelector('.l1'), root.querySelector('.l2'), track], 150);

  root._shape = shape;
  root._arm = () => { armed = true; shape(); };
  return root;
}

const CATS = [

function buildAsk(){
  const box = el('section','ask');
  const LINES = [
    ['t','מה אם'], ['t','החלום הבא'], ['t','שלך'],
    ['b','נמצא במרחק'], ['b','כמה נקודות?'],
  ];
  const head = el('h2','ask__line', LINES.map(([cls, txt]) =>
    '<span class="' + cls + '">' +
    txt.split(' ').map(w => '<i class="w">' + w + '</i>').join(' ') +
    '</span>').join(''));
  const panel = el('div','ask__panel');
  panel.appendChild(head);
  box.appendChild(panel);
  const deck = el('div','deck');
  const tiles = CATS.map(c => {
    const t = el('article','tile');
    const holder = el('div','tile__v');
    holder.appendChild(freshVideo('POV%20Videos/'+c.v+'_720x1280.mp4'));
    holder.appendChild(el('h3','', c.t));
    t.appendChild(holder);
    deck.appendChild(t);
    return t;
  });
  panel.appendChild(deck);

  const words = [...head.querySelectorAll('.w')];
  const bolds = [...head.querySelectorAll('.b .w')];

  /* One ramp sized to the whole bold block, offset per word. It is grown by
     BLEED on every side because glyph ink reaches past each word's own box,
     and anything outside the gradient rectangle simply is not painted. */
  function paintBold(){
    if (!bolds.length) return;
    let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
    bolds.forEach(w => {
      const q = w.getBoundingClientRect();
      l = Math.min(l, q.left); t = Math.min(t, q.top);
      r = Math.max(r, q.right); b = Math.max(b, q.bottom);
    });
    if (!isFinite(l) || r <= l) return;
    const BLEED = 140;
    const gw = (r - l) + BLEED * 2, gh = (b - t) + BLEED * 2;
    bolds.forEach(w => {
      const q = w.getBoundingClientRect();
      w.style.backgroundSize = gw + 'px ' + gh + 'px';
      w.style.backgroundPosition =
        -(q.left - l + BLEED) + 'px ' + -(q.top - t + BLEED) + 'px';
    });
  }

  /* every window floats up from just below its own place, one after the next */
  function armTiles(){
    tiles.forEach((t, i) => {
      t.style.setProperty('--from',
        'translateY(110px) rotate(' + (CATS[i].rest * 2.6).toFixed(2) + 'deg) scale(.92)');
      t.style.setProperty('--to', 'rotate(' + CATS[i].rest + 'deg)');
      t.style.removeProperty('transform');
      t.style.removeProperty('transition');
    });
  }

  function layout(){ armTiles(); paintBold(); }
  requestAnimationFrame(layout);
  addEventListener('resize', layout);
  if (document.fonts) document.fonts.ready.then(layout);   /* metrics settle late */

  /* the windows only play while they are on screen */
  function playback(){
    tiles.forEach(t => {
      const b = t.getBoundingClientRect();
      const v = t.querySelector('video');
      const near = b.top < innerHeight * 1.15 && b.bottom > -innerHeight * .15;
      if (near) { if (v.paused) play(v); } else if (!v.paused) v.pause();
    });
  }
  addEventListener('scroll', () => requestAnimationFrame(playback), { passive:true });
  playback();

  enter(head, words, 70);
  enter(deck, tiles, 340, false);   /* the windows bring their own rise */

  box._tick = layout;
  return box;
}

/* ================= HOW IT WORKS · three steps inside the reel ================= */

/* --- step 1: a hand that picks one of four windows, over and over --- */
const ART_PICK = (() => {
  const S = 92, X = [14, 122], Y = [8, 116];
  const puff = 'M4 24 a10 10 0 0 1 2 -20 a13 13 0 0 1 24 -5 a11 11 0 0 1 18 10 ' +
               'a9 9 0 0 1 -3 15 z';
  /* a four-point sparkle, drawn with four pinched curves */
  const star = (cx, cy, r) => {
    const w = r * .17;
    return '<path d="M' + cx + ' ' + (cy - r) +
      ' Q' + (cx + w) + ' ' + (cy - w) + ' ' + (cx + r) + ' ' + cy +
      ' Q' + (cx + w) + ' ' + (cy + w) + ' ' + cx + ' ' + (cy + r) +
      ' Q' + (cx - w) + ' ' + (cy + w) + ' ' + (cx - r) + ' ' + cy +
      ' Q' + (cx - w) + ' ' + (cy - w) + ' ' + cx + ' ' + (cy - r) + ' Z"/>';
  };
  const clouds = (ox, oy) =>
    '<g transform="translate(' + (ox + 12) + ',' + (oy + 24) + ') scale(.92)">' +
      '<path d="' + puff + '"/></g>' +
    '<g transform="translate(' + (ox + 40) + ',' + (oy + 54) + ') scale(.58)">' +

  const stars = (ox, oy) =>
    star(ox + 44, oy + 36, 17) + star(ox + 24, oy + 64, 9) + star(ox + 68, oy + 64, 11);

  /* 0 top-left, 1 top-right, 2 bottom-left, 3 bottom-right */
  const cells = [[X[0], Y[0]], [X[1], Y[0]], [X[0], Y[1]], [X[1], Y[1]]];
  const art   = [clouds, stars, stars, clouds];
  const lit   = ['pickB', 'pickA', 'pickC', 'pickD'];   /* the order the hand visits */

  const grid = cells.map(([x, y], i) =>
    '<rect x="' + x + '" y="' + y + '" width="' + S + '" height="' + S + '" rx="18"/>' +
    '<rect class="pick ' + lit[i] + '" x="' + x + '" y="' + y + '" ' +

    '<g class="hand">' +

      '<path d="M42 40 a6 6 0 0 1 12 0 v10"/>' +

/* --- step 3: the window, the wing, and clouds going past --- */
const ART_FLY = (() => {
  const puff = 'M4 24 a10 10 0 0 1 2 -20 a13 13 0 0 1 24 -5 a11 11 0 0 1 18 10 ' +
               'a9 9 0 0 1 -3 15 z';
  /* two nested groups on purpose: a CSS transform REPLACES the SVG transform
     attribute, so the drift and the placement cannot live on the same node */
  const cloud = (cls, x, y, sc) =>
    '<g class="cloud ' + cls + '">' +
      '<g transform="translate(' + x + ',' + y + ') scale(' + sc + ')">' +
        '<path d="' + puff + '"/>' +
      '</g>' +
    '</g>';
  return '<svg viewBox="0 0 220 250">' +
    '<defs><clipPath id="winClip">' +
      '<rect x="40" y="26" width="140" height="192" rx="58"/>' +
    '</clipPath></defs>' +
    '<rect x="26" y="12" width="168" height="220" rx="70"/>' +
    '<rect x="40" y="26" width="140" height="192" rx="58"/>' +
    '<path d="M96 42 h28"/>' +
    '<g clip-path="url(#winClip)">' +
      '<path d="M40 150 H180" opacity=".4"/>' +
      cloud('cloud--a', -30, 168, 1) +
      cloud('cloud--b', -30, 184, 1.3) +
      cloud('cloud--c', -30, 138, .72) +
      /* the wing holds still, and hides whatever passes behind it */
      '<path class="wing" d="M18 248 L122 122 L128 104 L141 109 L136 130 L108 260 Z"/>' +
      '<path d="M52 212 L128 128" opacity=".55"/>' +
    '</g>' +
  '</svg>';
})();

const HOW = [
  { art: ART_PICK, tone: 'blue', h: 'בוחרים חלום ומשריינים',
    p: ['חופשה, הופעה או משחק שתמיד רציתם!',
        'בוחרים מועד ומשריינים במקדמה'],
    note: ['20% מקדמה', 'מהסכום הסופי, והחלום שמור לכם למועד שבחרתם'] },
  { art: ART_CARD, tone: 'purple', h: 'צוברים נקודות עד לחלום',
    p: ['משתמשים בכרטיס אשראי FlyAll וצוברים',
        'נקודות עד המועד שנקבע'],
    note: ['1 נקודה = 1₪', 'ככל שתצברו יותר נקודות ככה תשלמו פחות בסוף'] },
  { art: ART_FLY,  tone: 'magenta', h: 'משלימים את היתרה ומגשימים',
    p: ['משלימים את היתרה בנקודות, בכסף או גם וגם,',
        'ויוצאים להגשים את החלום'],
    note: ['עד חודשיים לפני המועד', 'מסיימים את התשלום ויוצאים לדרך'],
    cta: 'לרכישה' },
];

/* the little two-note approval, synthesised — no asset to ship or preload */
let actx = null;
function unlockAudio(){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }catch(e){ actx = null; }
}
function chime(){
  if (!actx) return;
  try{
    const t0 = actx.currentTime;
    [[880, 0], [1318.5, .085]].forEach(([f, at]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0 + at);
      g.gain.exponentialRampToValueAtTime(.07, t0 + at + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + at + .17);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + at); o.stop(t0 + at + .22);
    });
  }catch(e){}
}

function buildHow(){
  const how = el('div','how');
  how.appendChild(el('div','how__veil'));

  const track = el('div','how__track');
  const steps = HOW.map(d => {
    const st = el('section','how__step tone-' + d.tone,
      '<div class="how__art">' + d.art + '</div>' +
      '<div class="how__copy">' +
        '<h3>' + d.h + '</h3>' +
        d.p.map(t => '<p>' + t + '</p>').join('') +
        '<div class="how__note"><b>' + d.note[0] + '</b>' +
          '<span>' + d.note[1] + '</span></div>' +
        (d.cta ? '<button class="how__cta">' + d.cta + '</button>' : '') +
      '</div>');
    track.appendChild(st);
    return st;
  });
  how.appendChild(track);

  const dots = el('div','how__dots');
  HOW.forEach(() => dots.appendChild(el('i')));
  how.appendChild(dots);

  const close = el('button','how__close', X);
  close.setAttribute('aria-label','סגירה');
  how.appendChild(close);

  let at = -1, chimeAt = null;
  /* the tick starts at 1.15s and runs .42s — the sound lands as it completes */
  const TICK_DONE = 1570;
  function show(i){
    if (i === at) return;
    at = i;
    clearTimeout(chimeAt);
    [...dots.children].forEach((b, j) => b.classList.toggle('on', j === i));
    /* the card redraws itself every time you come back to it, sound and all */
    steps.forEach((st, j) => st.classList.toggle('play', j === i));
    if (i === 1) chimeAt = setTimeout(chime, TICK_DONE);
  }
  track.addEventListener('scroll', () => requestAnimationFrame(() => {
    const mid = track.getBoundingClientRect().left + track.clientWidth / 2;
    let best = 0, dist = Infinity;
    steps.forEach((st, j) => {
      const r = st.getBoundingClientRect();
      const d = Math.abs(r.left + r.width / 2 - mid);
      if (d < dist) { dist = d; best = j; }
    });
    show(best);
  }), { passive:true });

  how._open  = () => { track.scrollLeft = 0; at = -1; show(0); };
  how._quiet = () => { clearTimeout(chimeAt); };
  how._close = close;
  return how;
}

const reel = el('div','reel');
const bars = el('div','reel__bars');
ARC.forEach(() => bars.appendChild(el('i')));
reel.appendChild(bars);

const reelTrack = el('div','reel__track');
const slides = ARC.map(d => {
  const sl = el('section','reel__slide');
  const v = document.createElement('video');
  v.className = 'reel__v';
  v.muted = true; v.loop = true; v.playsInline = true;
  v.setAttribute('playsinline',''); v.setAttribute('muted','');
  v.preload = 'none'; v.dataset.src = d.src;
  const stage_ = el('div','reel__stage');
  stage_.appendChild(v);
  stage_.appendChild(el('div','reel__foot'));
  const logos = d.logos.map(f => '<img src="assets/logos/' + f + '" alt="">')
                       .join(d.logos.length > 1 ? '<em>&amp;</em>' : '');
  stage_.appendChild(el('div','reel__copy',
    '<div class="logos' + (d.logos.length > 1 ? ' duo' : '') + '">' + logos + '</div>' +
    '<div class="event">' + d.event + '</div>'));
  const hint = el('div','reel__hint', CHEV);
  stage_.appendChild(hint);
  const veil = el('div','reel__veil');
  stage_.appendChild(veil);
  sl.appendChild(stage_);

  const i = ARC.indexOf(d);
  sl.appendChild(el('div','reel__detail',
      '<p class="rd__kicker">החוויה</p>'
    + '<h3 class="rd__title">' + d.event.split(' · ')[0] + '</h3>'
    + '<p class="rd__about">' + ABOUT[i] + '</p>'
    + '<h4 class="rd__h">תאריכים</h4>'
    + '<div class="rd__chips">' + DATES.map(x => '<span>' + x + '</span>').join('') + '</div>'
    + '<h4 class="rd__h">חבילות</h4>'
    + '<ul class="rd__packs">' + PACKS.map(([n, pt]) =>
        '<li><b>' + n + '</b><span>' + pt + '</span></li>').join('') + '</ul>'));

  const act = el('div','reel__act','<button class="rd__cta">איך מגשימים את החלום?</button>');
  stage_.appendChild(act);

  /* the black rises with the scroll; the nudge bows out once it starts */
  sl.addEventListener('scroll', () => {
    const p = Math.min(1, sl.scrollTop / (sl.clientHeight * 0.45));   /* fully black well before the sheet ends */
    veil.style.backgroundPosition = '0 ' + (p * 100).toFixed(1) + '%';
    hint.style.opacity = sl.scrollTop > 24 ? '0' : '';
    act.classList.toggle('show', sl.scrollTop > 40);
  }, { passive:true });

  reelTrack.appendChild(sl);
  return sl;
});
reel.appendChild(reelTrack);

const how = buildHow();
reel.appendChild(how);
function openHow(){
  unlockAudio();                       /* we are inside the tap, so this is allowed */
  slides.forEach(sl => { sl.scrollTop = 0; });
  reel.classList.add('how-open');
  how._open();
}
function closeHow(){ reel.classList.remove('how-open'); how._quiet(); }
how._close.onclick = closeHow;
reel.addEventListener('click', e => {
  if (e.target.closest('.rd__cta')) openHow();
});

const reelClose = el('button','reel__close', X);
reelClose.setAttribute('aria-label','סגירה');
reel.appendChild(reelClose);
document.body.appendChild(reel);

let reelIndex = -1;
function setSlide(i){
  if (i === reelIndex) return;
  reelIndex = i;
  slides.forEach((sl, j) => {
    const v = sl.querySelector('video');
    if (Math.abs(j - i) <= 1 && !v.src) v.src = v.dataset.src;   /* only the neighbours load */
    if (j === i) { v.currentTime = 0; play(v); } else v.pause();
    sl.classList.remove('live');
  });
  slides.forEach(sl => {
    sl.scrollTop = 0;
    const a = sl.querySelector('.reel__act'); if (a) a.classList.remove('show');
    const vl = sl.querySelector('.reel__veil'); if (vl) vl.style.backgroundPosition = '0 0';
  });
  requestAnimationFrame(() => slides[i] && slides[i].classList.add('live'));
  [...bars.children].forEach((b, j) => b.classList.toggle('on', j === i));
}
reelTrack.addEventListener('scroll', () => requestAnimationFrame(() => {
  const mid = reelTrack.getBoundingClientRect().left + reelTrack.clientWidth / 2;
  let best = 0, dist = Infinity;
  slides.forEach((sl, j) => {
    const r = sl.getBoundingClientRect();
    const d = Math.abs((r.left + r.width / 2) - mid);
    if (d < dist) { dist = d; best = j; }
  });
  setSlide(best);
}), { passive:true });

function openReel(i){
  reel.classList.add('open');
  document.body.classList.add('reel-open');
  stopAll();                       /* nothing plays behind the full frame */
  requestAnimationFrame(() => {
    const sl = slides[i];
    const r = sl.getBoundingClientRect(), t = reelTrack.getBoundingClientRect();
    reelTrack.scrollLeft += (r.left + r.width/2) - (t.left + t.width/2);
    reelIndex = -1;
    setSlide(i);
  });
}
function closeReel(){
  reel.classList.remove('how-open');
  how._quiet();
  reel.classList.remove('open');
  document.body.classList.remove('reel-open');
  slides.forEach(sl => sl.querySelector('video').pause());
  reelIndex = -1;
  arc._shape && arc._shape();      /* hand playback back to the carousel */
}
reelClose.onclick = closeReel;
addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !reel.classList.contains('open')) return;
  if (reel.classList.contains('how-open')) closeHow(); else closeReel();
});

/* ================= SECTION 5 · footer ================= */
const FOOT_COLS = [
  ['חוויות',  ['ספורט', 'הופעות', 'סקי', 'פסטיבלים']],
  ['המועדון', ['הנקודות שלי', 'איך צוברים', 'ההזמנות שלי', 'כרטיס FlyAll']],
  ['שירות',   ['שאלות נפוצות', 'יצירת קשר', 'מדיניות ביטולים', 'נגישות']],
];
const SOCIAL = [
  ['Instagram','<rect x="3" y="3" width="18" height="18" rx="5.2"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.15" fill="currentColor" stroke="none"/>'],
  ['Facebook', '<path fill="currentColor" stroke="none" d="M13.6 21v-7.3h2.5l.4-2.9h-2.9V9c0-.85.24-1.42 1.45-1.42h1.55V4.99c-.27-.04-1.19-.12-2.26-.12-2.24 0-3.77 1.37-3.77 3.87v2.06H8v2.9h2.57V21h3.03z"/>'],
  ['TikTok',   '<path fill="currentColor" stroke="none" d="M16.6 3h-2.72v11.63a2.06 2.06 0 1 1-1.72-2.03V9.85a4.9 4.9 0 1 0 4.44 4.88V9.2a5.8 5.8 0 0 0 3.4 1.09V7.58A3.4 3.4 0 0 1 16.6 4.2V3z"/>'],
  ['YouTube',  '<path fill="currentColor" stroke="none" d="M21.6 8.2a2.5 2.5 0 0 0-1.74-1.78C18.29 6 12 6 12 6s-6.29 0-7.86.42A2.5 2.5 0 0 0 2.4 8.2 26.3 26.3 0 0 0 2 12a26.3 26.3 0 0 0 .4 3.8 2.5 2.5 0 0 0 1.74 1.78C5.71 18 12 18 12 18s6.29 0 7.86-.42a2.5 2.5 0 0 0 1.74-1.78A26.3 26.3 0 0 0 22 12a26.3 26.3 0 0 0-.4-3.8zM10 15.1V8.9l5.2 3.1-5.2 3.1z"/>'],
];
const FOOT_LEGAL = ['תנאי שימוש', 'מדיניות פרטיות', 'הצהרת נגישות'];

function buildFoot(){
  const box = el('footer','foot');

  /* the header's mark, re-used — its gradient id is renamed so the two never collide */
  const mark = document.querySelector('.fa-logo svg').outerHTML.replace(/faLogoGrad/g,'faFootGrad');
  const brand = el('div','foot__brand', mark + '<p>החלומות שלך,<br>בנקודות שלך.</p>');
  box.appendChild(brand);

  const cols = el('div','foot__cols');
  const colEls = FOOT_COLS.map(([title, links]) => {
    const c = el('div','', '<h4>'+title+'</h4>' +
      links.map(l => '<a href="#">'+l+'</a>').join(''));
    cols.appendChild(c);
    return c;
  });
  box.appendChild(cols);

  const social = el('div','foot__social',
    SOCIAL.map(([name, path]) =>
      '<a href="#" aria-label="'+name+'"><svg width="20" height="20" viewBox="0 0 24 24" ' +
      'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" ' +
      'stroke-linejoin="round">'+path+'</svg></a>').join(''));
  box.appendChild(social);

  box.appendChild(el('div','foot__rule'));
  box.appendChild(el('div','foot__legal',
    '<nav>' + FOOT_LEGAL.map(l => '<a href="#">'+l+'</a>').join('') + '</nav>' +
    '<small>© 2026 FlyAll. כל הזכויות שמורות. מימוש נקודות בכפוף לתקנון המועדון ' +
    'ולזמינות המלאי. התמונות והסרטונים להמחשה בלבד.</small>'));

  enter(brand, [brand, ...colEls, social, box.querySelector('.foot__legal')], 130);
  return box;
}

/* ---------------- mount ---------------- */
const stage = document.getElementById('stage');
const arc = buildArc(), ask = buildAsk(), perks = buildPerks(), foot = buildFoot();
stage.appendChild(arc);
stage.appendChild(ask);
stage.appendChild(perks);
stage.appendChild(foot);
requestAnimationFrame(() => { arc._shape && arc._shape(); ask._tick(); });

/* The page opens straight into the lobby — there is no intro. The bar still
   floats in, and everything below it is released to its own on-arrival animation. */
const header = document.querySelector('.fa-header');
if (header) header.classList.add('rv');
let started = false;
function start(){
  if (started) return;
  started = true;
  if (header) header.classList.add('in');
  armEntries();                     /* sections start watching from here */
  arc._arm();                       /* and the rail's videos start playing */
}
/* a frame first, so the bar has an opacity to travel from — but never only a
   frame: a throttled rAF would leave the whole page invisible and inert */
requestAnimationFrame(start);
setTimeout(start, 120);
</script>
