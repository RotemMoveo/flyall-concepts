<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlyAll — קונספטים</title>
<style>
  :root { --w: 420px; --bg: #0e0f13; --ink: #f4f4f6; --muted: #8b8d98; --chip: #1c1e25; --accent: #ffffff; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  header { width: 100%; max-width: var(--w); display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 4px 12px; }
  .brand { font-weight: 700; font-size: 15px; letter-spacing: .02em; }
  .brand small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); letter-spacing: 0; }
  nav { display: flex; gap: 4px; background: var(--chip); padding: 4px; border-radius: 999px; }
  nav a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600;
    padding: 7px 14px; border-radius: 999px; transition: background .2s, color .2s; white-space: nowrap; }
  nav a[aria-current="page"] { background: var(--accent); color: #111; }
  .stage { flex: 1; min-height: 0; width: 100%; display: flex; justify-content: center; padding-bottom: 16px; }
  iframe { width: var(--w); max-width: 100%; height: 100%; border: 0; border-radius: 28px; background: #fff;
    box-shadow: 0 0 0 1px #2a2c35, 0 30px 80px rgba(0,0,0,.55); }
  /* On a real phone: full-bleed, compact bar */
  @media (max-width: 480px) {
    header { padding: 8px 12px; }
    .brand small { display: none; }
    .stage { padding-bottom: 0; }
    iframe { border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">FlyAll<small>תצוגת מובייל · 420px</small></div>
  <nav>
    <a href="#1">קונספט 1</a>
    <a href="#2">קונספט 2</a>
    <a href="#3">קונספט 3</a>
  </nav>
</header>
<div class="stage">
  <iframe id="view" title="קונספט" allow="autoplay; fullscreen; picture-in-picture"></iframe>
</div>
<script>
  const view = document.getElementById('view');
  function show() {
    const n = ['1','2','3'].includes(location.hash.slice(1)) ? location.hash.slice(1) : '1';
    document.querySelectorAll('nav a').forEach(a => a.hash === '#' + n ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    const src = n + '.html';
    if (!view.src.endsWith('/' + src)) view.src = src;
    view.title = 'קונספט ' + n;
    document.title = 'FlyAll — קונספט ' + n;
  }
  addEventListener('hashchange', show);
  show();
</script>
</body>
</html>
